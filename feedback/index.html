<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback — E-WIT</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0c0f;--panel:#0f1318;--border:#1e2530;--border-bright:#2e3f52;
  --green:#00ff88;--green-dark:#003322;--amber:#ffb300;--amber-dim:#cc8800;--amber-dark:#331e00;
  --cyan:#00d4ff;--cyan-dim:#0099cc;--cyan-dark:#001a22;--red:#ff4444;
  --text:#ffffff;--text-dim:#6a8090;--text-bright:#e8f4ff;
  --mono:'Share Tech Mono',monospace;--display:'Rajdhani',sans-serif;
}
[data-theme="light"]{
  --bg:#f0f2f5;--panel:#ffffff;--border:#d0d8e0;--border-bright:#a0b0c0;
  --green:#007744;--green-dark:#d0ffe8;--amber:#cc7700;--amber-dim:#aa5500;--amber-dark:#fff3d0;
  --cyan:#0077aa;--cyan-dim:#005588;--cyan-dark:#d0f0ff;--red:#cc2222;
  --text:#1a2a3a;--text-dim:#4a6070;--text-bright:#000000;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--display);font-size:16px;min-height:100vh;transition:background .2s,color .2s}
[data-theme="dark"] body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.05) 2px,rgba(0,0,0,.05) 4px);pointer-events:none;z-index:9999}
header{border-bottom:1px solid var(--border-bright);padding:16px 28px;background:var(--panel);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.mil-badge{font-family:var(--mono);font-size:11px;color:var(--amber);border:1px solid var(--amber-dim);padding:3px 8px;letter-spacing:2px;background:var(--amber-dark);margin-right:12px}
h1{display:inline;font-size:19px;font-weight:700;color:var(--green);letter-spacing:2px}
.theme-btn{font-family:var(--mono);font-size:11px;background:var(--panel);border:1px solid var(--border-bright);color:var(--text-dim);padding:7px 14px;cursor:pointer;letter-spacing:1px}
.wrap{max-width:560px;margin:0 auto;padding:40px 24px 60px}
.back-link{display:inline-block;font-family:var(--mono);font-size:12px;color:var(--text-dim);text-decoration:none;margin-bottom:20px;letter-spacing:.5px}
.back-link:hover{color:var(--green)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:28px 26px}
.card h2{font-size:22px;color:var(--text-bright);margin-bottom:8px}
.card .sub{font-family:var(--mono);font-size:12px;color:var(--text-dim);line-height:1.6;margin-bottom:22px}
label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--text-dim);text-transform:uppercase;margin-bottom:6px;margin-top:16px}
label:first-of-type{margin-top:0}
select,textarea,input[type=text]{width:100%;background:var(--bg);border:1px solid var(--border-bright);color:var(--text-bright);
  padding:10px 12px;border-radius:4px;font-family:var(--display);font-size:15px}
select:focus,textarea:focus,input[type=text]:focus{outline:none;border-color:var(--green)}
textarea{resize:vertical;min-height:110px;font-family:var(--display)}
.submit-btn{width:100%;background:var(--green-dark);border:1px solid var(--green);color:var(--green);
  padding:12px;border-radius:5px;font-family:var(--mono);font-size:13px;letter-spacing:1px;cursor:pointer;margin-top:20px}
.submit-btn:hover{background:var(--green);color:#052012}
.err{color:var(--red);font-size:12.5px;font-family:var(--mono);margin-top:8px;min-height:16px}
.thanks{display:none;text-align:center;padding:20px 0}
.thanks.show{display:block}
.thanks .icon{font-size:40px;margin-bottom:12px}
.thanks h2{color:var(--green);margin-bottom:10px}
.thanks p{font-family:var(--mono);font-size:13px;color:var(--text-dim);line-height:1.6}
</style>
</head>
<body>
<header>
  <div><span class="mil-badge">MIL-SPEC</span><h1>E-WIT</h1></div>
  <button class="theme-btn" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'dark':'light'">&#9728; THEME</button>
</header>

<div class="wrap">
  <a class="back-link" href="/">&larr; Back to E-WIT</a>

  <div class="card">
    <div id="formView">
      <h2>Feedback</h2>
      <p class="sub">Found a bug, have a suggestion, or something not working right? Let us know below — this goes straight to the instructor.</p>

      <label for="fbCategory">Category</label>
      <select id="fbCategory">
        <option value="Bug">Bug / something's broken</option>
        <option value="Suggestion">Suggestion / idea</option>
        <option value="Content Issue">Content issue (wrong info, typo, etc.)</option>
        <option value="Other">Other</option>
      </select>

      <label for="fbPage">Which page or tool? (optional)</label>
      <input type="text" id="fbPage" placeholder="e.g., Subnet Calculator, WRAVEN Module 3...">

      <label for="fbMessage">Details</label>
      <textarea id="fbMessage" placeholder="What happened, or what would help?"></textarea>

      <div class="err" id="fbErr"></div>
      <button class="submit-btn" onclick="submitFeedback()">SEND FEEDBACK</button>
    </div>

    <div class="thanks" id="thanksView">
      <div class="icon">&#9989;</div>
      <h2>Thanks!</h2>
      <p>Your feedback was sent. If it's something urgent, feel free to also mention it in person.</p>
    </div>
  </div>
</div>

<iframe name="feedbackFrame" id="feedbackFrame" style="display:none" title="feedback submission"></iframe>
<script>
// ---- Feedback Google Form wiring ----
// TODO: replace with your feedback form's real formResponse URL + entry IDs
// (same "Get pre-filled link" trick used for the WRAVEN roster form)
const FEEDBACK_FORM_URL = 'PASTE_GOOGLE_FORM_FORMRESPONSE_URL_HERE';
const FEEDBACK_ENTRY_CATEGORY = 'entry.XXXXXXXXX';
const FEEDBACK_ENTRY_PAGE = 'entry.XXXXXXXXX';
const FEEDBACK_ENTRY_MESSAGE = 'entry.XXXXXXXXX';

// Auto-fill "which page" from the referring page, if the person arrived via a footer link
(function(){
  try {
    const ref = document.referrer;
    if (ref && ref.indexOf(location.host) !== -1) {
      const path = new URL(ref).pathname.replace(/\/index\.html$/, '').replace(/\//g, '');
      if (path) document.getElementById('fbPage').value = path;
    }
  } catch(e) {}
})();

function submitFeedback(){
  const category = document.getElementById('fbCategory').value;
  const page = document.getElementById('fbPage').value.trim();
  const message = document.getElementById('fbMessage').value.trim();
  const err = document.getElementById('fbErr');

  if (!message) {
    err.textContent = 'Please add a few details before sending.';
    return;
  }
  err.textContent = '';

  if (FEEDBACK_FORM_URL.startsWith('http')) {
    const form = document.createElement('form');
    form.action = FEEDBACK_FORM_URL;
    form.method = 'POST';
    form.target = 'feedbackFrame';
    form.style.display = 'none';
    const fields = {};
    fields[FEEDBACK_ENTRY_CATEGORY] = category;
    fields[FEEDBACK_ENTRY_PAGE] = page;
    fields[FEEDBACK_ENTRY_MESSAGE] = message;
    for (const key in fields) {
      const input = document.createElement('input');
      input.type = 'hidden'; input.name = key; input.value = fields[key];
      form.appendChild(input);
    }
    document.body.appendChild(form);
    form.submit();
    setTimeout(function(){ form.remove(); }, 1500);
  }

  if (window.goatcounter && window.goatcounter.count) {
    window.goatcounter.count({path: 'feedback-submitted', title: 'Feedback Submitted', event: true});
  }

  document.getElementById('formView').style.display = 'none';
  document.getElementById('thanksView').classList.add('show');
}
</script>
<script data-goatcounter="https://ewit-training.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/sw.js').catch(function(e) {
      console.warn('SW registration failed:', e);
    });
  });
}
</script>
</body>
</html>
