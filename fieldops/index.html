<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-WIT Field Ops: Enlist to First Unit</title>
<meta name="description" content="A free-play EW training game. Enlist, survive Basic, learn the fundamentals at AIT, then earn your gear and take taskings at your first unit. Works on phones and desktops.">
<meta property="og:title" content="E-WIT Field Ops">
<meta property="og:description" content="Enlist, train, and serve. Four items in the ruck, so choose well.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#1d2114">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23ff7a2f'/%3E%3Ctext x='50' y='70' font-size='62' text-anchor='middle'%3E%F0%9F%93%A1%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;900&family=Public+Sans:wght@500;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#dcd9c3; --panel:#f5f1df; --panel2:#e9e4cc; --ink:#1d2114; --muted:#585d42; --line:#1d2114;
  --signal:#ff7a2f; --ok:#2f8a3b; --bad:#c4372b; --olive:#5b6b3a; --screen:#0a1416;
  --disp:'Big Shoulders Stencil Display','Impact','Arial Narrow',sans-serif;
  --body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#12150d; --panel:#20261a; --panel2:#2b3222; --ink:#efe9d0; --muted:#adb28f; --line:#070905; --ok:#66d073; --bad:#ff7a6b; }
}
:root[data-theme="dark"]{ --bg:#12150d; --panel:#20261a; --panel2:#2b3222; --ink:#efe9d0; --muted:#adb28f; --line:#070905; --ok:#66d073; --bad:#ff7a6b; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:500 16px/1.45 var(--body);min-height:100dvh;-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
h1,h2,h3{font-family:var(--disp);font-weight:900;margin:0;line-height:1.02;letter-spacing:.01em}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,.node:focus-visible{outline:3px solid var(--signal);outline-offset:2px}

.case{background:var(--panel);border:3px solid var(--line);border-radius:14px;box-shadow:0 4px 0 var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:8px 20px;border:3px solid var(--line);border-radius:11px;background:var(--signal);color:#1d2114;font:900 20px/1 var(--disp);letter-spacing:.05em;box-shadow:0 4px 0 var(--line);cursor:pointer;transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.alt{background:var(--panel2);color:var(--ink)}
.btn.sm{min-height:40px;padding:6px 14px;font-size:17px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}

/* ---------- title ---------- */
.title{max-width:560px;margin:0 auto;padding:0 0 40px}
.hero{display:block;width:100%;height:auto;border-bottom:3px solid var(--line)}
.title h1{font-size:clamp(46px,14vw,74px);padding:16px 18px 0}
.title .tag{padding:6px 18px 0;color:var(--muted);font-weight:700;font-size:17px}
.pick{padding:18px}
.pick h2{font-size:26px;margin-bottom:10px}
.cards{display:grid;gap:10px}
.cc{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;text-align:left;padding:10px 12px;cursor:pointer;background:var(--panel)}
.cc svg{width:64px;height:64px;border-radius:50%;border:3px solid var(--line);background:#8fb0b8}
.cc b{font:900 24px/1 var(--disp)}
.cc small{display:block;color:var(--muted);font-weight:600;line-height:1.3;margin-top:3px}
.cc[aria-pressed="true"]{background:var(--signal);color:#1d2114}
.cc[aria-pressed="true"] small{color:#1d2114}
.call{display:block;margin:16px 0 0;font-weight:800}
.call input{display:block;width:100%;margin-top:6px;padding:11px 12px;border:3px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:700 18px var(--body)}

/* ---------- world ---------- */
.world{max-width:560px;margin:0 auto;padding:10px 12px 60px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.hud{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:10px 12px;position:sticky;top:6px;z-index:10}
.hud .av svg{display:block;width:54px;height:54px;border-radius:50%;border:3px solid var(--line);background:#8fb0b8}
.who b{font:900 26px/1 var(--disp)}
.who span{display:block;color:var(--muted);font-weight:700;font-size:14px}
.meter{grid-column:1/-1;display:flex;align-items:center;gap:10px;font:600 13px var(--mono)}
.bar{flex:1;height:14px;border:3px solid var(--line);border-radius:8px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--signal);transition:width .5s}
.loadout{padding:12px}
.loadout h2{font-size:24px;margin-bottom:8px}
.gs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
.gear{flex:none;width:84px;display:grid;justify-items:center;gap:4px;padding:8px 4px;border:3px solid var(--line);border-radius:12px;background:var(--panel2);cursor:pointer}
.gear svg{width:44px;height:44px}
.gear span{font:800 12px/1.1 var(--body);text-align:center}
.gear.lock svg{filter:grayscale(1) brightness(.35);opacity:.55}
.gear.lock{border-style:dashed;color:var(--muted)}
.mapcard{overflow:hidden;padding:0}
#map{display:block;width:100%;height:auto}
.node{cursor:pointer}
.node .bd{fill:#f5f1df;stroke:#1d2114;stroke-width:4}
.node text{font:900 19px var(--disp);fill:#1d2114;paint-order:stroke;stroke:#f5f1df;stroke-width:5px;stroke-linejoin:round}
.node .pulse{fill:none;stroke:#ff7a2f;stroke-width:4;opacity:0}
.node.avail .pulse{opacity:1;transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
.node.locked .ic{filter:grayscale(1) brightness(.4);opacity:.6}
.node.locked .bd{fill:#c7c3ad}
.node .lk,.node .ck{display:none}
.node.locked .lk{display:block}
.node.done .ck{display:block}
@keyframes pulse{from{transform:scale(.9);opacity:.9}to{transform:scale(1.5);opacity:0}}
.foot{text-align:center;color:var(--muted);font-size:14px;font-weight:600}
.foot button{background:none;border:0;text-decoration:underline;cursor:pointer;color:var(--muted);padding:10px}

/* ---------- layers ---------- */
.layer{position:fixed;inset:0;z-index:50;background:rgba(18,22,10,.76);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:720px;max-height:96dvh;overflow:auto;padding:16px;border-radius:18px 18px 0 0;overscroll-behavior:contain}
@media (min-width:760px){.layer{align-items:center}.sheet{border-radius:18px}}
.sheet h2{font-size:34px}
.sheet p{margin:8px 0}
.obj{margin:8px 0;padding-left:20px}.obj li{margin:3px 0}
.rew{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;margin-top:12px;padding:10px;border:3px dashed var(--line);border-radius:12px;background:var(--panel2)}
.rew svg{width:56px;height:56px}
.rew b{font:900 22px/1 var(--disp)}
.rew small{display:block;color:var(--muted);font-weight:600;line-height:1.3;margin-top:2px}
.mhd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.mhd h2{font-size:30px}
.prog{display:flex;gap:5px;margin-bottom:12px}
.prog i{flex:1;height:12px;border:3px solid var(--line);border-radius:6px;background:var(--panel2)}
.prog i.ok{background:var(--ok)}.prog i.bad{background:var(--bad)}.prog i.on{background:var(--signal)}
.qcard{padding:12px 14px;border:3px solid var(--line);border-radius:12px;background:var(--panel2);margin-bottom:10px}
.qcard .qk{font:800 13px var(--body);color:var(--muted)}
.qcard .qq{font:700 19px/1.3 var(--body);margin-top:2px}
.opts{display:grid;gap:8px}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;min-height:50px;border:3px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);font:700 16px/1.25 var(--body);box-shadow:0 3px 0 var(--line);cursor:pointer}
.opt.ok{background:color-mix(in srgb,var(--ok) 42%,var(--panel))}
.opt.bad{background:color-mix(in srgb,var(--bad) 42%,var(--panel))}
.opt.dim{opacity:.35}
.opt[disabled]{cursor:default}
.fb{margin-top:12px;font-weight:600;min-height:1.5em}
.fb b{font-weight:800}
.fb .yes{color:var(--ok);font-weight:800}.fb .no{color:var(--bad);font-weight:800}
.hintbox{margin-top:8px;padding:8px 12px;border-left:6px solid var(--signal);background:var(--panel2);font-weight:600}

/* SDR */
.sdr{max-width:600px;margin:0 auto 12px;border:3px solid var(--line);border-radius:12px;overflow:hidden;background:var(--screen);box-shadow:0 4px 0 var(--line)}
.sdr-top,.sdr-ax{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px;padding:5px 10px;font:600 12px var(--mono);color:#9fd6d0;background:#0f2226}
.sdr-top span,.sdr-ax span{white-space:nowrap}
.sdr-top b{color:#ffb06a;font-weight:600}
.sdr canvas{display:block;width:100%;image-rendering:pixelated}

/* maps */
.mapc{border:3px solid var(--line);border-radius:12px;overflow:hidden;background:#a9ba7c;box-shadow:0 4px 0 var(--line)}
.mapc canvas{display:block;width:100%;height:auto;cursor:crosshair}
.rd{margin-top:10px;font:600 14px var(--mono);display:flex;flex-wrap:wrap;gap:6px 14px}
.rd b{font-weight:600;color:var(--signal)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{padding:8px 14px;border:3px solid var(--line);border-radius:99px;background:var(--panel2);font:800 15px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--signal);color:#1d2114}

/* rogue AP */
.aps{display:grid;gap:8px}
.ap{text-align:left;padding:10px 12px;border:3px solid var(--line);border-radius:12px;background:var(--panel);cursor:pointer;display:block;width:100%}
.ap b{font:900 22px/1 var(--disp)}
.ap small{display:block;font:600 12px/1.5 var(--mono);color:var(--muted);margin-top:4px}
.ap[aria-pressed="true"]{outline:4px solid var(--signal)}
.ap.rogue{background:color-mix(in srgb,var(--bad) 32%,var(--panel))}
.ap.fine{background:color-mix(in srgb,var(--ok) 25%,var(--panel))}

/* link budget */
.calc{display:grid;gap:10px;margin-top:10px}
.calc label{display:flex;justify-content:space-between;font-weight:800}
.calc input[type=range]{width:100%;accent-color:var(--signal);height:32px}
.gauge{position:relative;height:30px;border:3px solid var(--line);border-radius:9px;background:var(--panel2);overflow:hidden}
.gauge i{position:absolute;left:0;top:0;bottom:0;background:var(--signal)}
.gauge u{position:absolute;top:-2px;bottom:-2px;width:4px;background:var(--ink)}
.checks{display:grid;gap:4px;font-weight:700}
.checks .y{color:var(--ok)}.checks .n{color:var(--bad)}
.diag{width:100%;height:auto;display:block;border:3px solid var(--line);border-radius:12px;background:#a9ba7c}

/* unlock */
.unlock{position:relative;text-align:center;overflow:hidden;padding:26px 16px 20px}
.unlock .rays{position:absolute;left:50%;top:120px;width:640px;height:640px;margin:-320px 0 0 -320px;background:repeating-conic-gradient(from 0deg,rgba(255,122,47,.35) 0 8deg,transparent 8deg 20deg);animation:spin 26s linear infinite;-webkit-mask:radial-gradient(circle,#000 20%,transparent 62%);mask:radial-gradient(circle,#000 20%,transparent 62%)}
.unlock>*{position:relative}
.unlock .big{width:150px;height:150px;margin:6px auto;display:block;animation:pop .6s cubic-bezier(.2,1.5,.4,1) both}
.unlock .big svg{width:100%;height:100%;display:block}
.unlock h2{font-size:44px;margin-top:4px}
.unlock .kick{font:900 22px var(--disp);letter-spacing:.08em;color:var(--signal);-webkit-text-stroke:1px var(--line)}
.unlock .lines{margin:10px 0;font:600 14px var(--mono);color:var(--muted)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{opacity:0;transform:scale(.2) rotate(-14deg)}}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;max-width:88vw;padding:10px 16px;border:3px solid var(--line);border-radius:12px;background:var(--ink);color:var(--bg);font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.4)}

@media (prefers-reduced-motion: reduce){
  .node.avail .pulse,.unlock .rays,.unlock .big{animation:none}
  .bar i{transition:none}
}
/* ---------- game (v2) ---------- */
.game{max-width:680px;margin:0 auto;padding:8px 10px 24px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:8px 10px;align-items:center}
.stg{font:900 22px/1 var(--disp)}
.objt{font-weight:700;font-size:14px;line-height:1.25;color:var(--muted);margin-top:3px}
.bagbar{display:flex;gap:5px}
.cvw{position:relative;padding:0;overflow:hidden;background:#000}
#gv{display:block;width:100%;height:auto;image-rendering:pixelated;touch-action:none}
.dlg{position:absolute;left:8px;right:8px;bottom:8px;padding:10px 12px;background:var(--panel);border:3px solid var(--line);border-radius:12px;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.dlg b{font:900 21px/1 var(--disp)}
.dlg p{margin:3px 0 4px;font-weight:600;line-height:1.35}
.dlg small{color:var(--muted);font-weight:700}
.hintbar{font:600 13px/1.4 var(--mono);padding:6px 10px;background:var(--panel2);border:3px solid var(--line);border-radius:10px;overflow-wrap:anywhere}
.ctxbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ctxbar:empty{display:none}
.ctl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:2px 6px}
.pad{position:relative;width:136px;height:136px;border-radius:50%;border:3px solid var(--line);background:var(--panel2);touch-action:none;flex:none}
.knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:var(--signal);border:3px solid var(--line);pointer-events:none}
.btns{display:grid;gap:10px;justify-items:end}
.rowb{display:flex;gap:8px}
.abtn{width:92px;height:92px;border-radius:50%;border:3px solid var(--line);background:var(--panel2);color:var(--ink);font:900 42px/1 var(--disp);box-shadow:0 5px 0 var(--line);cursor:pointer}
.abtn.hot{background:var(--signal);color:#1d2114}
.abtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:8px 0}
@media (min-width:520px){.slots{grid-template-columns:repeat(4,minmax(0,1fr))}}
.slot{display:grid;justify-items:center;align-content:center;gap:4px;padding:8px 4px;border:3px solid var(--line);border-radius:12px;background:var(--panel2);cursor:pointer;min-height:96px}
.slot svg{width:44px;height:44px}
.slot span{font:800 12px/1.1 var(--body);text-align:center}
.slot.empty{border-style:dashed;color:var(--muted);cursor:default}
.slot.mini{width:42px;height:42px;min-height:0;padding:0;border-radius:9px;place-items:center}
.slot.mini svg{width:30px;height:30px}
.radio{display:flex;align-items:center;justify-content:center;gap:14px;margin:12px 0}
.chn{font:600 34px var(--mono);min-width:130px;text-align:center;padding:6px;border:3px solid var(--line);border-radius:10px;background:var(--screen);color:#ffb06a}
.nb{display:block;width:100%;height:auto;border:3px solid var(--line);border-radius:12px;background:#a9ba7c;margin:8px 0}
.calcl{display:flex;flex-wrap:wrap;justify-content:space-between;font-weight:800;margin-top:8px}
.calcl input{width:100%;accent-color:var(--signal);height:32px}
.tl{display:grid;gap:6px;margin:6px 0 10px}
.idc{display:flex;align-items:center;gap:6px;cursor:help}
.idc svg{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:#8fb0b8;flex-shrink:0}
.idc span{display:flex;align-items:baseline;gap:5px;line-height:1.1}
.idc b{font:900 13px/1 var(--disp)}
.idc small{color:var(--muted);font-weight:600;font-size:10px}
.tg{padding:7px 10px;border:3px solid var(--line);border-radius:10px;background:var(--panel2);font-weight:700;line-height:1.3}
.tg.ok{background:color-mix(in srgb,var(--ok) 30%,var(--panel2))}
.cap{margin:10px 0;border:3px solid var(--line);border-radius:10px;background:var(--panel2);overflow-x:auto;padding:6px;font:600 12px/1.4 var(--mono)}
.cap table{border-collapse:collapse;width:100%}
.cap th,.cap td{padding:3px 6px;text-align:left;white-space:nowrap}
.cap tr:nth-child(even){background:rgba(0,0,0,.06)}
.sdr .cw{position:relative}
.curl{position:absolute;top:0;bottom:0;width:2px;background:#ff3d5a;pointer-events:none}
.axp{position:relative;height:20px;background:#0f2226;font:600 12px var(--mono);color:#9fd6d0}
.axp span{position:absolute;top:2px;transform:translateX(-50%)}
.sdr .cw canvas{cursor:crosshair}
.title{max-width:560px}
.foot{text-align:center}
.foot button{background:none;border:0;text-decoration:underline;cursor:pointer;color:var(--muted);padding:10px;font-weight:600}
.unlock .rays{top:150px}

.axp span:first-child{transform:none}
.axp span:last-child{transform:translateX(-100%)}

</style>
</head>
<body>
<div id="app"></div>
<div id="layer" class="layer" hidden></div>
<div id="toast" class="toast" hidden></div>
<script>
'use strict';
(() => {
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const R = Math.random;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = (R() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#1d2114', TS = 32;
const hh = (x, y) => { const v = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return v - Math.floor(v); };
let G = null, run = null;

function avatar(kind) {
  const sk = { scout: '#e2ac82', analyst: '#b27b52', pilot: '#f0c8a0' }[kind];
  const body = { scout: '#5b6b3a', analyst: '#6b5a44', pilot: '#3f5468' }[kind];
  let s = `<circle cx="50" cy="50" r="50" fill="#8fb0b8"/><path d="M8 100 C10 78 30 74 50 74 C70 74 90 78 92 100Z" fill="${body}" stroke="${INK}" stroke-width="3"/>`;
  s += `<ellipse cx="50" cy="55" rx="25" ry="27" fill="${sk}" stroke="${INK}" stroke-width="3"/>`;
  if (kind === 'scout') {
    s += `<path d="M22 50 C20 18 80 18 78 50 C70 38 30 38 22 50Z" fill="#5b6b3a" stroke="${INK}" stroke-width="3"/><rect x="24" y="40" width="52" height="6" fill="#ff7a2f" stroke="${INK}" stroke-width="2.5"/>
          <rect x="44" y="14" width="12" height="9" rx="2" fill="#2b3320" stroke="${INK}" stroke-width="2.5"/>
          <path d="M22 54 C14 64 20 74 32 74" fill="none" stroke="${INK}" stroke-width="3"/><circle cx="33" cy="74" r="3.5" fill="#ff7a2f" stroke="${INK}" stroke-width="2"/>`;
  } else if (kind === 'analyst') {
    s += `<path d="M24 46 C24 22 76 22 76 46 C70 34 30 34 24 46Z" fill="#2b2118" stroke="${INK}" stroke-width="3"/>
          <circle cx="40" cy="55" r="9" fill="rgba(255,255,255,.35)" stroke="${INK}" stroke-width="3"/><circle cx="60" cy="55" r="9" fill="rgba(255,255,255,.35)" stroke="${INK}" stroke-width="3"/><path d="M49 55H51" stroke="${INK}" stroke-width="3"/>
          <path d="M26 74 C26 92 74 92 74 74" fill="none" stroke="#ff7a2f" stroke-width="6" stroke-linecap="round"/>`;
  } else {
    s += `<path d="M22 46 C22 20 78 20 78 46 L78 42 C68 34 32 34 22 42Z" fill="#ff7a2f" stroke="${INK}" stroke-width="3"/><path d="M22 44 H8" stroke="${INK}" stroke-width="3"/>
          <circle cx="39" cy="40" r="8" fill="#9fd6d0" stroke="${INK}" stroke-width="3"/><circle cx="61" cy="40" r="8" fill="#9fd6d0" stroke="${INK}" stroke-width="3"/><path d="M47 40H53" stroke="${INK}" stroke-width="3"/>`;
  }
  s += `<circle cx="40" cy="58" r="3" fill="${INK}"/><circle cx="60" cy="58" r="3" fill="${INK}"/><path d="M43 69 Q50 74 57 69" stroke="${INK}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  return `<svg viewBox="0 0 100 100" aria-hidden="true">${s}</svg>`;

/* ---- network bench */
function runNetwork(root, done) {
  const D = { A: { n: 'PC-A', x: 50, y: 50, p: 1 }, B: { n: 'PC-B', x: 50, y: 190, p: 1 }, S: { n: 'Switch', x: 175, y: 120, p: 4 }, T: { n: 'Router', x: 280, y: 120, p: 2 }, N: { n: 'Internet', x: 360, y: 60, p: 1 } };
  let cab = [], sel = null, ok = false;
  const use = k => cab.filter(c => c.includes(k)).length;
  const route = from => { const seen = new Set([from]), prev = {}, q = [from]; while (q.length) { const k = q.shift(); cab.forEach(c => { if (c.includes(k)) { const o = c[0] === k ? c[1] : c[0]; if (!seen.has(o)) { seen.add(o); prev[o] = k; q.push(o); } } }); } if (!seen.has('N')) return null; const p = []; let k = 'N'; while (k) { p.unshift(k); k = prev[k]; } return p; };
  function draw(msg) {
    root.innerHTML = `<p>Wire the lab network so both PCs can reach the internet. Tap one device, then another, to run a cable. Tap a cable to remove it.</p>
      <svg class="nb" viewBox="0 0 420 240" role="group" aria-label="Network bench">${cab.map((c, i) => `<line x1="${D[c[0]].x}" y1="${D[c[0]].y}" x2="${D[c[1]].x}" y2="${D[c[1]].y}" stroke="${ok ? '#2f8a3b' : '#1d2114'}" stroke-width="5"/><line data-c="${i}" x1="${D[c[0]].x}" y1="${D[c[0]].y}" x2="${D[c[1]].x}" y2="${D[c[1]].y}" stroke="transparent" stroke-width="18" style="cursor:pointer"/>`).join('')}
      ${Object.entries(D).map(([k, d]) => `<g data-d="${k}" style="cursor:pointer"><rect x="${d.x - 34}" y="${d.y - 22}" width="68" height="44" rx="8" fill="${sel === k ? '#ff7a2f' : '#f5f1df'}" stroke="#1d2114" stroke-width="3"/><text x="${d.x}" y="${d.y + 1}" text-anchor="middle" font-size="12" font-weight="800" fill="#1d2114">${d.n}</text><text x="${d.x}" y="${d.y + 15}" text-anchor="middle" font-size="10" font-weight="700" fill="#585d42">ports ${use(k)}/${d.p}</text></g>`).join('')}</svg>
      <div class="fb" aria-live="polite">${msg || ''}</div><div class="row"><button class="btn" id="tt">Test network</button><button class="btn alt sm" id="rs">Remove all cables</button><button class="btn" id="nx" hidden>Finish</button></div>`;
    $$('[data-d]', root).forEach(g0 => g0.onclick = () => {
      const k = g0.dataset.d; if (ok) return;
      if (!sel) { sel = k; draw(); return; } if (sel === k) { sel = null; draw(); return; }
      if (cab.some(c => c.includes(sel) && c.includes(k))) { sel = null; draw('Those two are already connected.'); return; }
      if (use(sel) >= D[sel].p || use(k) >= D[k].p) { const f = use(sel) >= D[sel].p ? sel : k; sel = null; draw(`<span class="no">No free port on ${D[f].n}.</span>`); return; }
      cab.push([sel, k]); sel = null; draw();
    });
    $$('[data-c]', root).forEach(l => l.onclick = () => { cab.splice(+l.dataset.c, 1); draw(); });
    $('#rs', root).onclick = () => { cab = []; sel = null; ok = false; draw(); };
    $('#tt', root).onclick = () => {
      const a = route('A'), b = route('B'); const r = k => k ? `<span class="yes">reached the internet via ${k.slice(1, -1).map(x => D[x].n).join(' → ') || 'a direct link'}</span>` : '<span class="no">no route to the internet</span>';
      if (a && b) { ok = true; draw(`PC-A ${r(a)}.<br>PC-B ${r(b)}.<br><b>Network is up.</b> A switch shares one uplink, and the router hands traffic to the outside.`); $('#nx', root).hidden = false; $('#tt', root).hidden = true; $('#nx', root).onclick = done; }
      else draw(`PC-A ${r(a)}.<br>PC-B ${r(b)}.<br>Check every hop: PCs to the switch, the switch to the router, the router to the internet.`);
    };
  }
  draw();
}

function cfgFor(id) { if (!act3()) return null; const sd = run ? run.seed : 1; return id === 'm1' ? genListening(sd) : id === 'm4' ? genCell(sd) : id === 'm7' ? genDrone(sd) : null; }
function siteFlow(m, who, intro, start, outro) {
  const f = F(), miss = missing(m.need);
  if (!act3()) {
    if (f[m.id]) return say(speak(who, ['Nice work earlier. Nothing more for you here.']));
    if (miss.length) return say([...speak(who, [intro[0]]), [who, `You need in your ruck: ${names(miss)}. Swap at a supply point.`]]);
    return say(speak(who, intro), () => start(null, () => finishM(m, who, outro)));
  }
  if (miss.length) return say(speak(who, [`You need in your ruck: ${names(miss)}. Swap at a supply point.`]));
  const t = G.tk.active, mine = t && t.kind === m.id;
  const go = task => { run = { task, seed: task ? task.seed : (R() * 1e9) | 0 }; start(cfgFor(m.id), () => finishM(m, who, outro)); };
  if (mine) return say(speak(who, ['Your tasking: ' + t.brief]), () => go(t));
  ask(`${who}: no tasking for this site. Run a practice session?`, ['Practice run', 'Not now'], i => { if (i === 0) go(null); });
}

  const miss = missing(m.need);
  if (!act3()) return oldMsg();
  if (miss.length) return `You need in your ruck: ${names(miss)}.`;
  const t = G.tk.active; run = { task: t && t.kind === m.id ? t : null, seed: (R() * 1e9) | 0 }; return null;
}

  if (act3()) return finishTask(m, who, outro, back);

/* ---- random mission configs */
function genEA(seed) {
  const r = rng(seed), out = [];
  for (let i = 0; i < 3; i++) { const Pt = [5, 10, 20, 30][(r() * 4) | 0], dl = 4 + ((r() * 9) | 0), min = 4 + ((r() * 7) | 0), req = 6 + ((r() * 7) | 0); let cap = [100, 200, 400][(r() * 3) | 0]; const best = c => 10 * Math.log10(c / Pt) + 12 + 20 * Math.log10(dl / min); while (best(cap) < req + 2) cap *= 2; out.push({ Pt, dl, req, cap, min }); }
  return out;
}
function genDrone(seed) {
  const r = rng(seed), em = [], nm = ['Repeater', 'Wi-Fi bridge', 'Cell node', 'Comms van'], base = { x: 40, y: 300 };
  while (em.length < 4) { const p = { x: 70 + r() * 370, y: 40 + r() * 230, n: nm[em.length] }; if (em.every(e => Math.hypot(e.x - p.x, e.y - p.y) > 110)) em.push(p); }
  let cur = base, left = [...em], len = 0; while (left.length) { left.sort((a, b) => Math.hypot(a.x - cur.x, a.y - cur.y) - Math.hypot(b.x - cur.x, b.y - cur.y)); const n = left.shift(); len += Math.max(0, Math.hypot(n.x - cur.x, n.y - cur.y) - 30); cur = n; }
  return { em, budget: Math.round(len * 1.3) };
}

    battery: `<rect x="175" y="150" width="46" height="24" fill="#333" ${S}/>${b ? '<circle cx="185" cy="152" r="4" fill="#7fe07f"/><circle cx="197" cy="150" r="3" fill="#7fe07f"/><circle cx="208" cy="153" r="4" fill="#7fe07f"/>' : ''}`,
    light: b ? `<circle cx="374" cy="118" r="8" fill="#555" ${S}/><path d="M368 112L380 124M378 112L370 122" stroke="#fff" stroke-width="2"/>` : `<circle cx="374" cy="118" r="8" fill="#ffd84a" ${S}/>`,
    cable: b ? `<path d="M95 95Q170 58 270 78" fill="none" stroke="#1d2114" stroke-width="4" stroke-dasharray="7 7"/><path d="M180 66l6-8l4 10l6-9" fill="none" stroke="#ff7a2f" stroke-width="3"/>` : `<path d="M95 95Q170 58 270 78" fill="none" stroke="#1d2114" stroke-width="4"/>`,
    latch: b ? `<rect x="338" y="58" width="18" height="7" fill="#c9c5b0" ${S}/>` : `<rect x="338" y="70" width="18" height="7" fill="#c9c5b0" ${S}/>`,
    fluid: b ? `<ellipse cx="340" cy="200" rx="26" ry="6" fill="#2a2010"/><path d="M340 176q-5 9 0 12q5-3 0-12z" fill="#2a2010"/>` : ''

(function(){
  var COOLDOWN_DAYS = 4;
  var last = localStorage.getItem('fb_nudge_last');
  var now = Date.now();
  if (last && (now - parseInt(last, 10)) < COOLDOWN_DAYS * 24 * 60 * 60 * 1000) return;
  setTimeout(function(){
    var el = document.getElementById('fbNudge');
    if (el) {
      el.classList.add('show');
      localStorage.setItem('fb_nudge_last', String(Date.now()));
    }
  }, 3 * 60 * 1000); // 3 minutes of being on the page
})();
</script>
</body>
</html>
