// ---------- CRITICAL THINKING / SCENARIO QUESTIONS ----------
{c:'net',q:'A user can successfully ping 8.8.8.8 by IP address, but typing www.google.com in a browser fails to load. What\'s the most likely problem?',o:['The default gateway is misconfigured','DNS resolution is failing, even though basic IP connectivity works fine','The subnet mask is wrong','The device\'s MAC address is corrupted'],a:1,e:'Since raw IP connectivity works (the ping succeeds), the problem isn\'t routing or the gateway — it\'s that the name-to-IP translation step (DNS) is broken, so the browser never gets an address to connect to.',r:'Networking Explained — DNS & URLs'},
{c:'net',q:'Two devices are on the same subnet with correct IP addresses and subnet masks, but they can\'t communicate, and neither gets an ARP reply from the other. What layer is the problem most likely at?',o:['Application layer — check the software version','Physical/Data Link layer — check the cable, switch port, or VLAN assignment','Transport layer — check the port numbers','Network layer — check the DNS server'],a:1,e:'If ARP itself isn\'t getting a reply, the problem is happening before IP addressing even matters — look at the physical connection, switch port status, or whether the devices are actually on the same VLAN.',r:'Networking Explained — MAC & IP'},
{c:'net',q:'A device can reach every other device on its own subnet, but nothing outside it — not even by IP address. What\'s the first thing to check?',o:['The DNS server address','The default gateway configuration','The device\'s own subnet mask','The MAC address table'],a:1,e:'Reaching local devices only, but nothing beyond the subnet, is the classic symptom of a missing or incorrect default gateway — that\'s the only thing standing between local traffic and everything else.',r:'Networking Explained — MAC & IP'},
{c:'net',q:'You need to provide exactly enough address space for 500 usable hosts on one subnet, with minimal waste. Which subnet mask fits best?',o:['/25 (126 usable hosts)','/23 (510 usable hosts)','/24 (254 usable hosts)','/22 (1,022 usable hosts)'],a:1,e:'You need at least 500 usable addresses. A /24 only gives 254 (too few); a /23 gives 510 — just enough with minimal waste. A /22 would technically work but wastes over 500 addresses.',r:'Networking Explained — Subnetting'},
{c:'net',q:'An engineer wants to split one /24 network into 4 equal-sized subnets. What CIDR notation should each resulting subnet use?',o:['/25','/26','/27','/28'],a:1,e:'Splitting into 4 equal parts means borrowing 2 more bits (2²=4), so a /24 becomes four /26 subnets, each with 62 usable hosts.',r:'Networking Explained — Subnetting'},
{c:'net',q:'A packet capture shows a device sending repeated SYN packets to a server, but no SYN-ACK ever comes back. What does this suggest?',o:['The connection completed successfully','The destination port is likely closed, filtered, or the host is unreachable','DNS resolution failed','The packet was corrupted by a checksum error'],a:1,e:'A SYN with no SYN-ACK response means the three-way handshake never gets past step one — typically because the port is closed, a firewall is dropping the traffic, or the destination isn\'t responding at all.',r:'Networking Explained — TCP/UDP & Ports'},
{c:'net',q:'A large file transferred over UDP arrives corrupted and incomplete, but the same file transferred over TCP arrives perfectly. Why does this make sense given how each protocol works?',o:['UDP always corrupts large files regardless of network conditions','TCP confirms delivery and resends lost/corrupted segments; UDP has no such mechanism and just keeps going','UDP is only designed for text files, not binary data','TCP files are always smaller so they transfer more reliably'],a:1,e:'TCP\'s reliability mechanisms (acknowledgments, retransmission) are exactly what catches and fixes lost or corrupted segments. UDP has none of that — whatever is lost or damaged in transit simply stays lost or damaged.',r:'Networking Explained — TCP/UDP & Ports'},
{c:'net',q:'A unit wants Soldiers to reach an internal training portal without that traffic ever touching the public internet. Which design choice best supports this?',o:['Assign the portal a public IP address and open it to the internet','Keep the portal on a private IP range with no route out to the internet, reachable only from inside the LAN','Use DHCP instead of static addressing for the server','Increase the subnet mask size'],a:1,e:'Private IP addressing combined with no outbound internet route keeps traffic contained entirely within the internal network — there\'s no path for that traffic to reach or be reached from the public internet at all.',r:'Networking Explained — MAC & IP'},
{c:'net',q:'Why is it a problem to assign the same subnet (e.g., 192.168.1.0/24) to two different sites connected over a WAN link?',o:['It isn\'t a problem — subnets can always be reused freely','Routers can\'t tell which site a given address actually belongs to, breaking reachability between the sites','It would only cause a minor slowdown, not a failure','Overlapping subnets automatically merge into one larger network'],a:1,e:'Routing depends on unique network identifiers to know where to send traffic. If both sites claim the same subnet, a router has no way to distinguish which site an address actually belongs to — traffic can\'t be reliably delivered to either.',r:'Networking Explained — Subnetting'},
{c:'net',q:'A technician replaces an old hub with a switch on a busy 10-device network segment. What change in behavior should they expect, and why?',o:['No change — hubs and switches function identically','Fewer collisions and better performance, since the switch delivers frames only to the intended device instead of broadcasting to everyone','Slower performance, since switches add processing delay','The devices will need new IP addresses'],a:1,e:'A hub blindly repeats every frame to every port, creating one shared collision domain. A switch learns MAC addresses and forwards frames only to the correct port, eliminating unnecessary collisions and improving throughput.',r:'Networking Explained — The Gear'},
{c:'wifi',q:'Residents in a crowded apartment building all report slow Wi-Fi on 2.4 GHz, even though their individual signal strength looks fine. What\'s the most likely cause, and the best first fix?',o:['Weak signal — buy a stronger antenna','Channel congestion from many overlapping networks — switch to a less-crowded channel or move to 5 GHz','The router\'s firmware is corrupted','IPv6 needs to be enabled'],a:1,e:'In a dense building, many networks compete for the same limited 2.4 GHz channels. The fix isn\'t more signal strength — it\'s reducing contention, either by switching to a cleaner channel or moving to the less-crowded 5 GHz band.',r:'Wi-Fi Explained — Bands'},
{c:'wifi',q:'A network was compromised after an attacker captured the WPA2 four-way handshake and cracked a weak, short passphrase offline. What\'s the most direct way to reduce this specific risk going forward?',o:['Hide the SSID','Use a long, complex passphrase (or move to WPA3, which resists offline dictionary attacks)','Switch back to WEP for compatibility','Disable the guest network'],a:1,e:'The handshake itself isn\'t the weakness — a weak passphrase is. A long, high-entropy passphrase makes offline brute-forcing impractical; WPA3\'s SAE handshake specifically hardens against this style of attack even further.',r:'Wi-Fi Explained — Security'},
{c:'wifi',q:'A team operating inside a multi-room building with several interior walls needs reliable Wi-Fi coverage across the whole space, even at the cost of speed. Should they favor 2.4 GHz or 5 GHz, and why?',o:['5 GHz, because it always has better range','2.4 GHz, because it penetrates walls and obstacles better than 5 GHz, even though it\'s slower','Neither matters — range is identical on both bands','6 GHz, because it\'s the newest band'],a:1,e:'2.4 GHz\'s longer wavelength penetrates walls and obstacles more effectively than 5 GHz. In a space with many interior walls, that range/penetration advantage often matters more than 5 GHz\'s higher speed.',r:'Wi-Fi Explained — Bands'},
{c:'wifi',q:'An access point is manually set to channel 4 in the 2.4 GHz band instead of channel 1, 6, or 11. What problem does this likely cause?',o:['No problem — any channel works equally well','Its signal overlaps with neighboring channels, causing more interference than using a non-overlapping channel would','It will automatically switch to 5 GHz','It disables WPA2 encryption'],a:1,e:'Channels 1, 6, and 11 are spaced far enough apart to avoid overlapping with each other. A channel like 4 sits between them and overlaps with both neighbors, creating more interference than necessary.',r:'Wi-Fi Explained — Bands'},
{c:'wifi',q:'At a conference with 50 devices connected to one access point, users report strong signal bars but poor actual throughput. What\'s the most likely bottleneck?',o:['Weak signal strength','Airtime contention — too many devices sharing the same limited airtime on one AP, regardless of signal quality','An expired IP lease','The wrong SSID being broadcast'],a:1,e:'Strong signal doesn\'t mean unlimited capacity — every device has to take turns using the shared airtime on that AP. With 50 devices contending for the same channel, congestion (not signal) is the bottleneck.',r:'Wi-Fi Explained — Standards'},
{c:'wifi',q:'Why would enabling MU-MIMO on an access point help more in a dense-device environment than simply increasing the AP\'s transmit power?',o:['Transmit power has no effect on Wi-Fi performance at all','MU-MIMO lets the AP serve multiple devices at once instead of one at a time, directly addressing congestion; more power doesn\'t fix that sharing bottleneck','Increasing transmit power always solves congestion issues','MU-MIMO and transmit power do the exact same thing'],a:1,e:'The problem in a crowded environment is devices taking turns for airtime, not weak signal. MU-MIMO addresses that directly by serving several devices simultaneously; boosting transmit power doesn\'t change how many devices can be served at once.',r:'Wi-Fi Explained — Standards'},
{c:'wifi',q:'A user\'s device shows a familiar SSID from their workplace, but connecting to it results in strange certificate warnings and it wasn\'t there yesterday in that exact spot. What should they suspect, and what could help confirm it?',o:['Normal network maintenance — ignore the warnings','A possible rogue/"evil twin" access point spoofing the legitimate SSID — checking the BSSID (hardware address) against the known legitimate AP can help confirm it','A firmware update on their own device','The AP switched from 2.4 GHz to 5 GHz'],a:1,e:'An SSID can be copied by anyone, but the BSSID (the AP\'s actual hardware address) is much harder to fake convincingly. Unexpected certificate warnings plus a new/unfamiliar physical presence are classic evil-twin red flags.',r:'Wi-Fi Explained — Security'},
{c:'wifi',q:'A network administrator wants to reduce interference on a busy office\'s Wi-Fi without buying new hardware. They currently have all three APs on the building\'s floor set to "auto" channel selection, and all three keep landing on channel 6. What\'s a better approach?',o:['Leave it as-is — auto-selection is always optimal','Manually assign the three APs to different non-overlapping channels (1, 6, 11) so they don\'t compete with each other','Switch all three APs to channel 4 instead','Disable two of the three APs entirely'],a:1,e:'Auto-selection can converge on the same channel across nearby APs, especially if they scan at similar times. Manually spreading them across the three non-overlapping channels (1, 6, 11) avoids that self-inflicted interference.',r:'Wi-Fi Explained — Bands'},
{c:'wifi',q:'Why does upgrading only the access points to Wi-Fi 6 (802.11ax) without upgrading client devices often produce disappointing real-world speed improvements?',o:['Wi-Fi 6 access points are always defective','Many of the speed and efficiency gains require both ends of the connection (AP and client) to support the same standard — an old client can\'t take advantage of features it doesn\'t support','Wi-Fi 6 only works with wired connections','Client devices automatically become incompatible with new APs'],a:1,e:'Standards like Wi-Fi 6 introduce features (like improvements to handling many devices efficiently) that require support on both the AP and the client device. An older client simply can\'t use capabilities it wasn\'t built to support, capping the real-world benefit.',r:'Wi-Fi Explained — Standards'},
{c:'cell',q:'A phone shows full signal bars on a nearby tower, but data throughput is extremely slow. Signal strength looks fine — what\'s a plausible cause that has nothing to do with signal?',o:['The phone\'s antenna is broken','The tower or its backhaul connection is congested/overloaded with too many users','The SIM card has expired','The phone is using the wrong frequency band entirely'],a:1,e:'Full bars only mean the radio link itself is strong — it says nothing about how much capacity is actually available. A congested tower or limited backhaul can bottleneck throughput even with excellent signal.',r:'Cellular Explained — Architecture'},
{c:'cell',q:'In a rural, low-density area, why might 5G\'s ultra-low-latency advantage matter far less than it would in a dense urban IoT deployment?',o:['5G doesn\'t function at all in rural areas','Low latency mainly pays off when many devices need near-instant, high-density coordination — a benefit that\'s largely wasted where there are few devices and little contention','Rural towers physically cannot support 5G hardware','Latency is identical everywhere regardless of device density'],a:1,e:'5G\'s headline low-latency, high-density design goals solve problems that mostly show up when huge numbers of devices are contending for the same resources — a rural deployment with few devices doesn\'t stress the network in that way, so the advantage is less pronounced.',r:'Cellular Explained — Generations'},
{c:'cell',q:'Why can\'t cellular network planners just assign the same frequency to every cell tower in a city?',o:['It would work fine — frequency reuse is unnecessary','Nearby cells using the same frequency would interfere with each other; frequencies must be reused only in cells spaced far enough apart','Every tower is required by law to use a unique frequency','Frequencies automatically reassign themselves to avoid conflicts'],a:1,e:'Spectrum is limited, so the same frequencies get reused across a city — but only in cells spaced far enough apart that they don\'t interfere with each other. Careless reuse in adjacent cells would cause serious interference.',r:'Cellular Explained — Architecture'},
{c:'cell',q:'What is the practical purpose of the network reassigning a subscriber\'s TMSI periodically instead of always using their IMSI?',o:['To increase data speeds','To reduce the amount of time a subscriber\'s permanent identity (IMSI) is exposed over the air, limiting tracking risk','To extend battery life on the device','To automatically upgrade the device to a newer generation network'],a:1,e:'Since the IMSI permanently identifies a specific subscriber, broadcasting it constantly would make tracking trivial. Reassigning a temporary TMSI instead limits how often the sensitive permanent identity actually needs to go over the air.',r:'Cellular Explained — Identifiers'},
{c:'cell',q:'Why would jamming a cell tower\'s broadcast/control channel potentially deny service to far more devices than jamming a single traffic channel?',o:['It wouldn\'t — all channels have identical impact','The broadcast/control channel is what every device in range needs to even initiate a connection; disrupting it can block new connections and signaling network-wide, not just one call','Broadcast channels are physically stronger and harder to jam','Traffic channels always carry more total data than control channels'],a:1,e:'A broadcast/control channel is shared infrastructure every device depends on just to find and connect to the network. Disrupting it can prevent many devices from ever establishing a connection, unlike jamming one dedicated traffic channel serving a single active session.',r:'Cellular Explained — Logical Channels'},
{c:'cell',q:'For a large stadium event needing a lot of extra cellular capacity for just a few hours, would deploying additional small cells or new macro towers make more practical sense?',o:['New macro towers, since they always have unlimited capacity','Small cells, since they\'re faster and cheaper to deploy temporarily and are well suited to adding capacity in a small, dense area','Neither — capacity can\'t be temporarily increased','Macro towers, because small cells can\'t handle any data traffic'],a:1,e:'Small cells are lower-power, shorter-range, and much quicker/cheaper to deploy for a temporary capacity boost in a small, densely packed area like a stadium — building a full macro tower for a few hours of extra demand doesn\'t make practical sense.',r:'Cellular Explained — Architecture'},
{c:'cell',q:'A subscriber crosses from one cell\'s coverage into a neighboring cell\'s coverage mid-call, and the call continues without dropping. What network process made this possible, and why does timing matter?',o:['Roaming — it only works between different countries','Handover — the network must transfer the connection to the new cell before the signal from the old cell degrades too far, or the call drops','IMEI reassignment','A completely new call is silently placed on the new tower'],a:1,e:'Handover is the process of transferring an active connection from one cell to another as a device moves. If the network doesn\'t complete that handover before the original cell\'s signal becomes too weak, the call drops instead of continuing seamlessly.',r:'Cellular Explained — Architecture'},
{c:'cell',q:'Two neighboring countries\' carriers have a roaming agreement. A subscriber crossing the border keeps cellular service automatically. What underlying identifier lets a foreign network recognize which carrier the subscriber actually belongs to?',o:['The subscriber\'s phone number alone','The PLMN embedded in their home network\'s identity (MCC + MNC), which the visited network can recognize against its roaming agreements','The device\'s IMEI','The Wi-Fi MAC address of their phone'],a:1,e:'The PLMN (built from the home carrier\'s MCC and MNC) is what lets a visited network identify which carrier, in which country, a roaming subscriber actually belongs to — enabling it to honor any roaming agreement in place.',r:'Cellular Explained — Identifiers'},
// ---------- PRACTICE-BASED SCENARIOS (PBQ-style) ----------
{c:'pbq',q:'You\'re given the network 192.168.10.0/24 and need to carve out the smallest subnet that can still fit a lab of 30 hosts. Which mask should you use?',o:['/25 (126 usable hosts)','/26 (62 usable hosts)','/27 (30 usable hosts)','/28 (14 usable hosts)'],a:2,e:'You need exactly 30 usable hosts. A /27 gives 2⁵−2 = 30 usable hosts — the tightest fit. A /28 (14 usable) is too small; /25 and /26 both waste far more address space than necessary.',r:'Networking Explained — Subnetting'},
{c:'pbq',q:'A workstation is configured with IP 192.168.1.50/24 and default gateway 192.168.2.1. It can\'t reach anything outside its own subnet. What\'s wrong?',o:['The subnet mask is too short','The gateway address is on a different subnet than the host, so it\'s unreachable','The DNS server is misconfigured','The MAC address is duplicated on the network'],a:1,e:'With a /24 mask, 192.168.1.50 belongs to the 192.168.1.0 subnet, but the gateway 192.168.2.1 sits in the 192.168.2.0 subnet — a different network entirely. The host can never reach a gateway that isn\'t on its own local subnet.',r:'Networking Explained — Subnetting'},
{c:'pbq',q:'A firewall log shows repeated blocked inbound attempts on TCP port 3389 from an external IP. What service was the attacker most likely targeting?',o:['DNS','RDP (Remote Desktop Protocol)','HTTP','SNMP'],a:1,e:'Port 3389 is the standard port for RDP, used for remote desktop access to Windows systems — a very common target for external scanning and brute-force attempts.',r:'Networking Explained — TCP/UDP & Ports'},
{c:'pbq',q:'An nslookup for a domain returns the correct IP address, but the browser still can\'t connect, and a ping to that same IP also times out. What does this tell you about where the problem is?',o:['DNS is broken and needs to be fixed first','DNS is working correctly; the problem is somewhere in reachability to that IP (routing, firewall, or the host itself)','The browser\'s cache needs to be cleared','The domain\'s registration has expired'],a:1,e:'Since nslookup successfully resolved the name to an IP, DNS did its job. The failure is happening at a later stage — the IP itself isn\'t reachable, which points to routing, a firewall rule, or the destination host being down, not DNS.',r:'Networking Explained — DNS & URLs'},
{c:'pbq',q:'Two devices are assigned to VLAN 10 and VLAN 20 respectively on the same switch, both with correct IP addresses for their own subnet. They cannot communicate with each other. What\'s needed to fix this?',o:['A faster switch','A device or feature that can route between VLANs (a router-on-a-stick or Layer 3 switch)','Assigning both devices to the same IP address','Disabling one of the two VLANs'],a:1,e:'VLANs are separate broadcast domains by design — switches alone won\'t pass traffic between them. Routing between VLANs requires a Layer 3 device: either a router with sub-interfaces ("router on a stick") or a Layer 3 switch capable of inter-VLAN routing.',r:'Networking Explained — The Gear'},
{c:'pbq',q:'A packet capture shows a client send a SYN with sequence number 1000. The server responds with SYN-ACK, sequence number 5000, acknowledgment number 1001. What should the client send next, and with what acknowledgment number?',o:['A FIN with ack=5001','An ACK with ack=5001, completing the handshake','A new SYN with ack=1002','A RST to close the connection'],a:1,e:'The final step of the three-way handshake is the client\'s ACK. Since the server\'s sequence number was 5000, the client acknowledges receiving up through that byte by sending ack=5001, completing the handshake.',r:'Networking Explained — TCP/UDP & Ports'},
{c:'pbq',q:'A host is assigned the address 10.20.30.45 with a /26 mask. What is the broadcast address for this host\'s subnet?',o:['10.20.30.63','10.20.30.255','10.20.30.31','10.20.30.127'],a:0,e:'A /26 mask creates blocks of 64 addresses. 10.20.30.45 falls in the block from 10.20.30.0 to 10.20.30.63, so the broadcast address (the last address in that block) is 10.20.30.63.',r:'Networking Explained — Subnetting'},
{c:'pbq',q:'A network engineer sees a broadcast channel capture showing MCC=310. Without knowing the MNC, what can they determine from the MCC alone?',o:['Nothing useful — MCC alone is meaningless','Which country the network operates in (310 is a well-known US-allocated MCC) — but not which specific carrier','The exact carrier and subscriber identity','The device\'s IMEI'],a:1,e:'MCC identifies the country only; MNC identifies the specific carrier within that country. Without the MNC, you know the general country of operation but not which carrier is running the network.',r:'Cellular Explained — Identifiers'},
{c:'pbq',q:'In a 3-story building, each floor\'s access point is set to 2.4 GHz channel 6, and users near stairwells report heavy interference between floors. What\'s the best fix?',o:['Increase transmit power on all three APs','Assign each floor a different non-overlapping channel (e.g., 1, 6, 11 rotated by floor)','Switch all three APs to channel 4','Disable Wi-Fi on the middle floor'],a:1,e:'2.4 GHz signal easily penetrates floors in a multi-story building. Reusing the same channel on adjacent floors creates co-channel interference; rotating through the three non-overlapping channels (1, 6, 11) floor-by-floor reduces that overlap.',r:'Wi-Fi Explained — Bands'},
{c:'pbq',q:'A device needs an IP address in the range 172.16.0.0/16, split so that each of 8 departments gets its own subnet of equal size. What subnet mask should be used for each department?',o:['/17','/18','/19','/20'],a:2,e:'Splitting one block into 8 equal parts requires borrowing 3 bits (2³=8), so a /16 becomes eight /19 subnets, each with 8,190 usable hosts.',r:'Networking Explained — Subnetting'},
{c:'pbq',q:'A technician captures traffic and sees a device send a DHCP Discover, followed by an Offer from a server, then a Request from the device, and finally an ACK from the server. At which step does the device actually receive its assigned IP configuration for use?',o:['At the Discover step','At the Offer step — the IP is already usable once offered','At the ACK step — only after this does the device apply the configuration','IP configuration is never explicitly confirmed in DHCP'],a:2,e:'Even though the Offer proposes an address, the device doesn\'t finalize and apply it until the server\'s ACK confirms the lease — that\'s the point at which the configuration is actually usable.',r:'Networking Explained — DHCP'},
{c:'pbq',q:'A Soldier\'s radio is assigned an IMEI of a specific handset, and a new SIM is inserted before a mission. Which identifier changes with the new SIM, and which stays the same?',o:['IMEI changes, IMSI stays the same','IMSI changes with the new SIM; IMEI stays the same because it belongs to the physical device','Both change together','Neither changes — they are fixed to the network, not the device or SIM'],a:1,e:'IMSI is tied to the SIM card and changes when the SIM changes. IMEI is burned into the physical handset and stays constant regardless of which SIM is inserted.',r:'Cellular Explained — Identifiers'},
{c:'pbq',q:'A user reports their laptop can access internal file shares by IP address but not by hostname (e.g., \\\\fileserver01), while a coworker on the same network has no issue with either. What should be checked first on the affected laptop?',o:['Its physical network cable','Its configured DNS server address','Its MAC address','Its assigned VLAN'],a:1,e:'Since another device on the same network resolves the hostname fine, the network/DNS server itself is working — the issue is most likely local to the affected laptop\'s own DNS configuration.',r:'Networking Explained — DNS & URLs'},
{c:'pbq',q:'A network needs point-to-point links between exactly 2 routers, wasting as little address space as possible on each link. What subnet size is the standard choice, and why?',o:['/24, because it\'s the default','/30, because it provides exactly 2 usable addresses — one for each router','/16, for future expansion','/32, since only one address is needed'],a:1,e:'A /30 has 2 host bits, giving exactly 2 usable addresses (2²−2=2) — precisely enough for both ends of a point-to-point link, with minimal address waste.',r:'Networking Explained — Subnetting'},
{c:'pbq',q:'A wireless survey shows an access point achieving strong signal (-45 dBm) but very low throughput when 40 clients are connected simultaneously. Which upgrade addresses the actual bottleneck?',o:['A higher-gain antenna for more signal strength','MU-MIMO support, so the AP can serve multiple clients concurrently instead of one at a time','A longer Ethernet cable to the AP','Switching the AP to 2.4 GHz for better range'],a:1,e:'Strong signal already exists, so the bottleneck is capacity/airtime sharing among many clients, not signal strength. MU-MIMO directly addresses that by serving multiple devices at once.',r:'Wi-Fi Explained — Standards'},
{c:'pbq',q:'A router interface is configured with IP 192.168.5.1/28. What is the valid range of host addresses on this subnet?',o:['192.168.5.1 – 192.168.5.14','192.168.5.0 – 192.168.5.15','192.168.5.1 – 192.168.5.30','192.168.5.16 – 192.168.5.30'],a:0,e:'A /28 mask creates blocks of 16 addresses. For the block starting at 192.168.5.0, the network ID is .0 and the broadcast is .15, leaving .1 through .14 as the valid usable host range.',r:'Networking Explained — Subnetting'},

let cat='all',len=15,pool=[],idx=0,score=0,answered=false,perCat={};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function setCat(c,btn){cat=c;document.querySelectorAll('.setup-bar .cbtn').forEach(b=>{if(b.id&&b.id.startsWith('cat-'))b.classList.remove('active');});btn.classList.add('active');start();}
function setLen(n,btn){len=n;document.querySelectorAll('.setup-bar .cbtn').forEach(b=>{if(b.id&&b.id.startsWith('len-'))b.classList.remove('active');});btn.classList.add('active');start();}
function catName(c){return c==='net'?'Networking':c==='wifi'?'Wireless / Wi-Fi':c==='cell'?'Cellular':'Practice Scenarios';}
function catClass(c){return c;}
 
function start(){
  let src=Q.filter(q=>cat==='all'||q.c===cat);
  pool=shuffle(src.slice()).slice(0,Math.min(len,src.length));
  idx=0;score=0;answered=false;perCat={net:{c:0,t:0},wifi:{c:0,t:0},cell:{c:0,t:0},pbq:{c:0,t:0}};
  render();
}
function render(){
  const p=document.getElementById('quiz-panel');
  if(idx>=pool.length){renderResults();return;}
  const q=pool[idx];
  // shuffle options, track correct value
  const opts=q.o.map((t,i)=>({t,correct:i===q.a}));shuffle(opts);
  const letters=['A','B','C','D','E'];
  const pct=Math.round(idx/pool.length*100);
  p.innerHTML=
    `<div class="topbar">
       <div class="progress-wrap"><div class="progress-txt">Question ${idx+1} of ${pool.length}</div>
         <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div></div>
       <div class="score-badge">Score ${score} / ${idx}${answered?'':''}</div>
     </div>
     <div class="cat-tag ${catClass(q.c)}">${catName(q.c)}</div>
     <div class="q-text">${q.q}</div>
     <div class="opts" id="opts">${opts.map((o,i)=>`<button class="opt" onclick="answer(this,${o.correct})"><span class="key">${letters[i]}</span>${o.t}</button>`).join('')}</div>
     <div class="feedback" id="fb"></div>
     <div class="nav-row"><button class="bigbtn" id="nextb" onclick="next()" disabled>Next \u2192</button></div>`;
  answered=false;
}
function refHTML(q){return q.r?('<div style="margin-top:8px;font-size:10px;letter-spacing:1px;color:var(--text-dim);text-transform:uppercase">\u25c8 Reference: '+q.r+'</div>'):'';}
function answer(btn,isCorrect){
  if(answered)return;answered=true;
  const q=pool[idx];perCat[q.c].t++;
  document.querySelectorAll('#opts .opt').forEach(b=>{b.disabled=true;});
  const fb=document.getElementById('fb');
  if(isCorrect){btn.classList.add('correct');score++;perCat[q.c].c++;fb.className='feedback good show';fb.innerHTML='\u2713 Correct. '+q.e+refHTML(q);}
  else{btn.classList.add('wrong');
    // reveal correct one
    document.querySelectorAll('#opts .opt').forEach(b=>{if(b.getAttribute('onclick').includes('true'))b.classList.add('correct');});
    fb.className='feedback bad show';fb.innerHTML='\u2717 Not quite. '+q.e+refHTML(q);}
  document.querySelector('.score-badge').textContent='Score '+score+' / '+(idx+1);
  document.getElementById('nextb').disabled=false;
}
function next(){idx++;render();}
function renderResults(){
  const p=document.getElementById('quiz-panel');
  const pct=Math.round(score/pool.length*100);
  const msg=pct>=90?'Outstanding — mission-ready on this material.':pct>=75?'Solid. Review the few you missed.':pct>=60?'Passing, but revisit the weak areas below.':'Keep studying — run it again by topic.';
  let bd='';['net','wifi','cell','pbq'].forEach(c=>{if(perCat[c].t>0){const cp=Math.round(perCat[c].c/perCat[c].t*100);
    bd+=`<div class="bd-cell"><div class="bl" style="color:var(--${c==='net'?'cyan':c==='wifi'?'green':c==='cell'?'amber':'purple'})">${catName(c)}</div><div class="bv" style="color:var(--${c==='net'?'cyan':c==='wifi'?'green':c==='cell'?'amber':'purple'})">${perCat[c].c}/${perCat[c].t}</div></div>`;}});
  p.innerHTML=
    `<div class="results">
       <div class="big">${score} / ${pool.length}</div>
       <div class="pct">${pct}% — ${msg}</div>
       <div class="breakdown">${bd}</div>
       <button class="bigbtn" onclick="start()">\u21ba Retake</button>
       <div class="hint-line">Change Topic or Length above to focus your next run.</div>
     </div>`;
}
window.addEventListener('load',start);
</script>
<script data-goatcounter="https://ewit-training.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
