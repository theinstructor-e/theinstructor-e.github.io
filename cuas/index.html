<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UAS RF Signature Trainer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080b0d;--panel:#0d1318;--panel2:#111820;--b1:#1a2530;--b2:#223040;
  --green:#00ff88;--gdim:#00883a;--gfaint:#001a0d;
  --amber:#ffb830;--adim:#8a6010;
  --red:#ff4040;--blue:#30aaff;--cyan:#00d4ff;
  --txt:#7aacbc;--txtd:#2a4a5a;--txtb:#c8e4f0;
  --mono:'Share Tech Mono',monospace;--ui:'Rajdhani',sans-serif;
}
[data-theme="light"]{
  --bg:#eef2f0;--panel:#ffffff;--panel2:#f5f7f6;--b1:#d4dcd9;--b2:#b8c4c0;
  --green:#00884a;--gdim:#00a05a;--gfaint:#e0f5e8;
  --amber:#b3690a;--adim:#d4a860;
  --red:#cc2222;--blue:#0077bb;--cyan:#0088aa;
  --txt:#3a5560;--txtd:#8296a0;--txtb:#0a1a20;
}
.theme-corner{position:fixed;top:14px;right:14px;z-index:200;background:var(--panel);border:1px solid var(--b2);color:var(--txtd);
  font-family:var(--ui);font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:7px 15px;
  cursor:pointer;transition:all .15s;border-radius:3px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.theme-corner:hover{color:var(--txt);border-color:#3a5266}
body{background:var(--bg);color:var(--txt);font-family:var(--ui);font-size:17px;padding:14px;line-height:1.4}
/* ── HEADER ── */
.hdr{margin-bottom:12px}
.hdr-title{font-size:20px;font-weight:700;color:var(--txtb);letter-spacing:.07em;text-transform:uppercase}
.hdr-sub{font-family:var(--mono);font-size:10px;color:var(--txtd);letter-spacing:.08em;margin-top:2px}
/* ── TABS ── */
.tab-bar{display:flex;flex-wrap:wrap;gap:2px;border-bottom:2px solid var(--b2)}
.related-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0 12px;font-family:var(--mono);font-size:10.5px}
.related-label{color:var(--txtd);letter-spacing:1px;text-transform:uppercase;white-space:nowrap}
.related-bar a{color:var(--cyan);text-decoration:none;border:1px solid var(--b2);padding:3px 10px;border-radius:12px;transition:.15s;white-space:nowrap}
.related-bar a:hover{border-color:var(--cyan);background:var(--panel2)}
.tbtn{background:var(--panel);border:1px solid var(--b1);border-bottom:none;color:var(--txtd);
  font-family:var(--ui);font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:7px 13px;cursor:pointer;position:relative;top:2px;transition:all .15s;white-space:nowrap}
.tbtn:hover{color:var(--txt);background:var(--panel2)}
.tbtn.act{color:var(--green);background:var(--panel2);border-color:var(--b2);border-bottom:2px solid var(--panel2)}
.tpane{display:none}
.tpane.act{display:block}
/* ── INSTRUMENT ── */
.inst{background:var(--panel2);border:1px solid var(--b2);border-top:none;padding:12px}
/* ── SA HEADER ROW ── */
.sa-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--b1)}
.sa-model{font-family:var(--mono);font-size:10px;color:var(--txtd);letter-spacing:.07em}
.sa-name{font-size:17px;font-weight:700;color:var(--txtb);letter-spacing:.06em;text-transform:uppercase}
.sa-ro{font-family:var(--mono);font-size:11px;color:var(--amber);text-align:right;line-height:1.6}
/* ── SCAN ROW ── */
.scan-row{display:flex;flex-wrap:wrap;gap:14px;font-family:var(--mono);font-size:10px;color:var(--txtd);margin-bottom:6px}
.sv{color:var(--amber)}
/* ── DISPLAY ── */
.disp{background:#030507;border:1px solid var(--b2);margin-bottom:8px;user-select:none}
.disp-inner{display:flex}
.yax{width:36px;flex-shrink:0;display:flex;flex-direction:column;justify-content:space-between;
  padding:2px 4px 2px 0;font-family:var(--mono);font-size:9px;color:var(--txtd);text-align:right}
.cvcol{flex:1;position:relative;min-width:0}
canvas{display:block;width:100%;image-rendering:auto}
.wf-lbl{font-family:var(--mono);font-size:9px;color:var(--txtd);padding:3px 0 2px 36px;
  border-top:1px solid var(--b1);letter-spacing:.05em}
.xax{display:flex;justify-content:space-between;padding:2px 0 0 36px;
  font-family:var(--mono);font-size:9px;color:var(--txtd)}
/* ── CONTROLS ROW ── */
.ctl-row{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
/* ── TOGGLE ── */
.tg-box{background:var(--panel);border:1px solid var(--b1);padding:10px 12px;min-width:200px}
.tg-title{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--txtd);font-weight:700;margin-bottom:8px}
.tg-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.tg-lbl{font-size:13px;font-weight:600;color:var(--txt);flex:1}
.sw{position:relative;width:48px;height:24px;flex-shrink:0}
.sw input{opacity:0;width:0;height:0}
.sl{position:absolute;inset:0;background:#112010;border:1px solid var(--b2);cursor:pointer;transition:background .2s}
.sl:before{content:'';position:absolute;height:16px;width:16px;left:3px;top:3px;
  background:var(--txtd);transition:transform .2s,background .2s}
input:checked+.sl{background:#051a0a;border-color:var(--gdim)}
input:checked+.sl:before{transform:translateX(24px);background:var(--green);box-shadow:0 0 6px var(--green)}
.pill{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:2px}
.pill.off{color:var(--red);border:1px solid #3a1010;background:#120505}
.pill.on{color:var(--green);border:1px solid var(--gdim);background:var(--gfaint);text-shadow:0 0 5px var(--green)}
/* ── DISTANCE SLIDER ── */
.dist-box{background:var(--panel);border:1px solid var(--b1);padding:10px 12px;min-width:200px;flex:1}
.dist-title{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--txtd);font-weight:700;margin-bottom:8px}
.dist-val{font-family:var(--mono);font-size:14px;color:var(--amber);margin-bottom:6px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;background:var(--b2);border-radius:0;cursor:pointer;margin-bottom:6px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:var(--amber);cursor:pointer;border-radius:0}
input[type=range]::-moz-range-thumb{width:14px;height:14px;background:var(--amber);cursor:pointer;border-radius:0;border:none}
.dist-note{font-size:11px;color:var(--txtd);line-height:1.5}
/* ── INFO BLOCKS ── */
.info-box{background:var(--panel);border:1px solid var(--b1);padding:10px 12px;flex:2;min-width:220px}
.ib-title{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--txtd);font-weight:700;margin-bottom:8px}
.ir{display:flex;justify-content:space-between;margin-bottom:4px;font-size:12px}
.ik{color:var(--txtd)}
.iv{font-family:var(--mono);color:var(--amber)}
.iv.g{color:var(--green)}
.iv.r{color:var(--red)}
.iv.b{color:var(--blue)}
/* ── IW PANEL ── */
.iw-box{background:var(--panel);border:1px solid var(--b1);padding:10px 12px;flex:2;min-width:220px}
.iw-item{display:flex;align-items:flex-start;gap:7px;margin-bottom:6px;font-size:12px;line-height:1.4}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:3px}
.dot.on{background:var(--green);box-shadow:0 0 5px var(--green)}
.dot.off{background:var(--txtd)}
.dot.amb{background:var(--amber);box-shadow:0 0 5px var(--amber)}
.iw-txt{color:var(--txt)}
.iw-txt.dim{color:var(--txtd);font-style:italic}
/* ── CALLOUT ── */
.callout{display:none;margin-top:10px;background:#050e08;border:1px solid #1a4428;padding:12px 14px}
.co-hdr{font-size:12px;font-weight:700;color:var(--green);letter-spacing:.04em;margin-bottom:6px}
.co-body{font-size:12px;color:var(--txt);line-height:1.7}
.co-body strong{color:var(--amber)}
.co-body em{color:var(--cyan)}
</style>
</head>
<body>
<button class="theme-corner" onclick="toggleTheme()" id="btn-theme">☀ Light Mode</button>

<div class="hdr">
  <div class="hdr-title">UAS RF Signature Trainer</div>
  <div class="hdr-sub">SPECTRUM ANALYZER SIMULATION  ·  112-17E10F09  ·  UNCLASSIFIED  ·  Toggle drones ON/OFF · Adjust distance slider to observe range effects</div>
</div>

<!-- TAB BAR -->
<div class="tab-bar" id="tabbar"></div>
<div class="related-bar">
  <span class="related-label">Related:</span>
  <a href="../cuasdemo/">🛸 C-UAS Engagement Simulator</a>
  <a href="../EW Principles/">📖 EW Principles</a>
</div>

<!-- TAB CONTENT injected by JS -->
<div id="tabcontent"></div>

<script>
'use strict';
function toggleTheme(){
  const html = document.documentElement;
  const isLight = html.getAttribute('data-theme') === 'light';
  html.setAttribute('data-theme', isLight ? 'dark' : 'light');
  document.getElementById('btn-theme').textContent = isLight ? '☀ Light Mode' : '☾ Dark Mode';
}
/* =================================================================
   DRONE DEFINITIONS
   Each drone: id, label, startGHz, stopGHz, description + signals[]

      {type:'fhss', freqGHz:2.442, bwMHz:20, peakDbm:-33, label:'OcuSync C2', color:'#ffb830',
        hopFreqs:[2.412,2.422,2.432,2.442,2.452,2.462,2.472,2.482], hopRate:10},

        hopFreqs:[5.735,5.755,5.775,5.795,5.815,5.835], hopRate:8},
    ],
    controls:[

    controls:[

/* =================================================================
   STATE
================================================================= */
const STATE = {};
DRONES.forEach(d => {
  STATE[d.id] = {
    on:{}, // control states keyed by ctrl id
    distKm: 1.0,
    hopIdx: {},
    wfRows: [],
    frameCount: 0,
  };
  d.controls.forEach(c => STATE[d.id].on[c.id] = false);
  d.signals.forEach((s,i) => {
    if(s.type === 'fhss') STATE[d.id].hopIdx[i] = 0;
  });
});

function makeXLabels(start, stop, n) {
  const labels = [];
  for(let i=0;i<n;i++){
    const v = start + (stop-start)*i/(n-1);
    labels.push(v.toFixed(v>=10?2:3));
  }
  return labels;
}

/* =================================================================
   CONTROLS
================================================================= */
function switchTab(id) {
  document.querySelectorAll('.tpane').forEach(p=>p.classList.remove('act'));
  document.querySelectorAll('.tbtn').forEach(b=>b.classList.remove('act'));
  document.getElementById('pane-'+id).classList.add('act');
  // find button by content match
  document.querySelectorAll('.tbtn').forEach(b=>{
    const d = DRONES.find(x=>x.id===id);
    if(d && b.textContent===d.label) b.classList.add('act');
  });
}

function ctrlToggle(did, cid, val) {
  STATE[did].on[cid] = val;
  const pill = document.getElementById('pill-'+did+'-'+cid);
  if(pill){ pill.textContent=val?'ON':'OFF'; pill.className='pill '+(val?'on':'off'); }
  updateIW(did);
  updateCallout(did);
}

function distChange(did, val) {
  STATE[did].distKm = parseFloat(val);
  const km = parseFloat(val);
  const loss = km <= 1 ? 0 : -(20 * Math.log10(km)).toFixed(1);
  document.getElementById('dist-val-'+did).textContent = km.toFixed(1) + ' km';
  document.getElementById('dist-note-'+did).textContent =
    km <= 1 ? 'Max signal — drone within 1 km' :
    `Path loss: ~${Math.abs(loss).toFixed(1)} dB vs 1 km ref · Signals weaker`;
}

function anyOn(did) {
  return Object.values(STATE[did].on).some(v=>v);
}

function isSigActive(did, sigIdx) {
  const d = DRONES.find(x=>x.id===did);
  const sig = d.signals[sigIdx];
  if(!sig || sig.bg || sig.always) return false;
  for(const c of d.controls){
    if(c.sigIds.includes(sigIdx) && STATE[did].on[c.id]) return true;
  }
  return false;
}

function updateIW(did) {
  const d = DRONES.find(x=>x.id===did);
  const on = anyOn(did);
  const el = document.getElementById('iw-'+did);
  const items = on ? d.iwOn : d.iwOff;
  el.innerHTML = items.map((txt,i)=>`
    <div class="iw-item">
      <div class="dot ${on ? (i===0?'on':'amb') : 'off'}"></div>
      <div class="iw-txt ${on?'':'dim'}">${txt}</div>
    </div>`).join('');
}

function updateCallout(did) {
  const d = DRONES.find(x=>x.id===did);
  const on = anyOn(did);
  const co = document.getElementById('co-'+did);
  const body = document.getElementById('cobody-'+did);
  co.style.display = on ? 'block' : 'none';
  body.innerHTML = on ? d.explainOn : d.explainOff;
}

/* =================================================================
   CANVAS SIZING — ResizeObserver ensures correct pixel width
================================================================= */
const canvasMap = {}; // id → {trace, annot, wfall}
DRONES.forEach(d => {
  canvasMap[d.id] = {
    trace: document.getElementById('trace-'+d.id),
    annot: document.getElementById('annot-'+d.id),
    wfall: document.getElementById('wfall-'+d.id),
    col:   document.getElementById('col-'+d.id),
    wfcol: document.getElementById('wfcol-'+d.id),
  };
});

function syncSize(did) {
  const m = canvasMap[did];
  const w = m.col.clientWidth;
  if(w < 10) return;
  [m.trace, m.annot].forEach(c => { if(c.width !== w) c.width = w; });
  const ww = m.wfcol.clientWidth;
  if(m.wfall.width !== ww) m.wfall.width = ww;
}

DRONES.forEach(d => {
  const ro = new ResizeObserver(() => syncSize(d.id));
  ro.observe(canvasMap[d.id].col);
});
// Initial size pass
setTimeout(() => DRONES.forEach(d => syncSize(d.id)), 50);

/* =================================================================
   DRAWING ENGINE
================================================================= */
function freqToX(ghz, startGHz, stopGHz, w) {
  return ((ghz - startGHz) / (stopGHz - startGHz)) * w;
}
function freqToBin(ghz, startGHz, stopGHz, bins) {
  return Math.round(((ghz - startGHz) / (stopGHz - startGHz)) * bins);
}
// Display runs -20 dBm (top) → -100 dBm (bottom)
const SA_REF = -20;   // top of display
const SA_RANGE = 80;  // dB span shown (down to -100 dBm)
function dbToY(db, h) {
  return Math.max(0, Math.min(h, ((SA_REF - db) / SA_RANGE) * h));
}
function nz(amp) { return (Math.random()-0.5)*2*amp; }

function distLoss(km) {
  if(km <= 1) return 0;
  return 20 * Math.log10(km);
}

function buildTrace(d, did, frame) {
  const st = STATE[did];
  const bins = d.bins;
  const arr = new Float32Array(bins);
  const loss = distLoss(st.distKm);

  // Noise floor ~-95 dBm with small thermal jitter
  for(let i=0;i<bins;i++) arr[i] = -95 + nz(2);

  d.signals.forEach((sig, si) => {
    const active = sig.always || sig.bg || isSigActive(did, si);
    if(!active) return;

    const peakAdj = sig.bg ? sig.peakDbm : sig.peakDbm - loss;
    if(peakAdj < -100) return; // too far, below noise

    if(sig.type === 'fhss') {
      const hops = sig.hopFreqs;
      const rate = sig.hopRate || 10;
      if(frame % rate === 0) {
        st.hopIdx[si] = (st.hopIdx[si]+1) % hops.length;
      }
      const cf = hops[st.hopIdx[si]];
      addBump(arr, d, cf, sig.bwMHz, peakAdj, bins, 3);

    } else { // cw
      addBump(arr, d, sig.freqGHz, sig.bwMHz, peakAdj, bins, sig.bg ? 4 : 2);
    }
  });

  // smooth
  for(let p=0;p<2;p++){
    for(let i=1;i<bins-1;i++) arr[i]=(arr[i-1]+arr[i]*2+arr[i+1])/4;
  }
  return arr;
}

function addBump(arr, d, cf, bwMHz, peakDbm, bins, noiseAmp) {
  const center = freqToBin(cf, d.startGHz, d.stopGHz, bins);
  const spanGHz = d.stopGHz - d.startGHz;
  const bwBins = Math.max(1, Math.round((bwMHz / 1000) / spanGHz * bins));
  const noiseFloor = -95;

  for(let i = 0; i < bins; i++){
    const dist = Math.abs(i - center);
    if(dist < bwBins * 5){
      // Gaussian shape: at center = peakDbm, falls off toward noise floor
      const falloff = (peakDbm - noiseFloor) * Math.exp(-(dist * dist) / (2 * bwBins * bwBins));
      const v = noiseFloor + falloff + nz(noiseAmp);
      if(v > arr[i]) arr[i] = v;
    }
  }
}

function drawTrace(ctx, w, h, arr) {
  ctx.clearRect(0,0,w,h);
  // Grid
  ctx.strokeStyle='#0c1c28'; ctx.lineWidth=1;
  for(let i=1;i<10;i++){
    const y=(i/10)*h;
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();
  }
  const steps=8;
  for(let i=1;i<steps;i++){
    const x=(i/steps)*w;
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();
  }
  // Fill
  const step=w/arr.length;
  ctx.beginPath();
  ctx.moveTo(0,h);
  for(let i=0;i<arr.length;i++){
    const x=i*step, y=dbToY(arr[i],h);
    i===0 ? ctx.lineTo(x,y) : ctx.lineTo(x,y);
  }
  ctx.lineTo(w,h);
  ctx.closePath();
  const g=ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'rgba(0,255,136,0.22)');
  g.addColorStop(1,'rgba(0,255,136,0.02)');
  ctx.fillStyle=g; ctx.fill();
  // Line
  ctx.beginPath();
  ctx.strokeStyle='#00ff88'; ctx.lineWidth=1.5;
  ctx.shadowBlur=3; ctx.shadowColor='#00ff88';
  for(let i=0;i<arr.length;i++){
    const x=i*step, y=dbToY(arr[i],h);
    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  }
  ctx.stroke(); ctx.shadowBlur=0;
}

function drawAnnotations(ctx, d, did, arr, w, h) {
  ctx.clearRect(0,0,w,h);
  const st = STATE[did];
  const loss = distLoss(st.distKm);

  d.signals.forEach((sig, si) => {
    if(sig.bg || sig.always) return;
    if(!isSigActive(did, si)) return;

    const peakAdj = sig.peakDbm - loss;
    if(peakAdj < -94) return; // at noise floor, not worth annotating

    let cf = sig.freqGHz;
    if(sig.type==='fhss') cf = sig.hopFreqs[st.hopIdx[si]];

    const x = freqToX(cf, d.startGHz, d.stopGHz, w);
    const y = dbToY(peakAdj - loss, h);

    ctx.strokeStyle = (sig.color||'var(--amber)') + 'aa';
    ctx.lineWidth=1; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(x,y-4); ctx.lineTo(x,h); ctx.stroke();
    ctx.setLineDash([]);

    const lw=130, lh=28;
    const lx=Math.min(x+5, w-lw-4);
    const ly=Math.max(y-32, 2);

    ctx.fillStyle='#0a0e12'; ctx.lineWidth=1;
    ctx.strokeStyle=(sig.color||'#ffb830')+'cc';
    ctx.fillRect(lx,ly,lw,lh);
    ctx.strokeRect(lx,ly,lw,lh);

    ctx.fillStyle=sig.color||'#ffb830';
    ctx.font='bold 10px Share Tech Mono';
    ctx.fillText(sig.label, lx+4, ly+12);

    ctx.fillStyle='#7aacbc';
    ctx.font='10px Share Tech Mono';
    const dispDb = (sig.peakDbm - loss).toFixed(1);
    ctx.fillText(cf.toFixed(3)+' GHz  '+dispDb+' dBm', lx+4, ly+23);
  });
}

function dbmToColor(db) {
  // Map -100 dBm (noise) → 0.0, -20 dBm (strong signal) → 1.0
  const t = Math.max(0, Math.min(1, (db - (-100)) / 80));
  if(t < 0.2)  return [0,   Math.round(t/0.2*30),  Math.round(t/0.2*120)];
  if(t < 0.45) return [0,   Math.round(30+(t-0.2)/0.25*225), Math.round(120-(t-0.2)/0.25*120)];
  if(t < 0.7)  return [Math.round((t-0.45)/0.25*255), 255, 0];
  return [255, Math.round(255-(t-0.7)/0.3*255), 0];
}

function drawWaterfall(ctx, w, h, rows, bins) {
  if(!rows.length) return;
  const rowH = h / WF_MAX;
  rows.forEach((row, ri) => {
    const img = ctx.createImageData(w, 1);
    const bpp = bins/w;
    for(let px=0;px<w;px++){
      const bin = Math.min(bins-1, Math.floor(px*bpp));
      const [r,g,b] = row[bin];
      const idx=px*4;
      img.data[idx]=r; img.data[idx+1]=g; img.data[idx+2]=b; img.data[idx+3]=255;
    }
    ctx.putImageData(img, 0, ri*rowH);
  });
}

/* =================================================================
   MAIN LOOP
================================================================= */
let frame = 0;
function loop() {
  frame++;
  DRONES.forEach(d => {
    const m = canvasMap[d.id];
    if(!m.trace.width || m.trace.width<10) return;

    const w=m.trace.width, h=m.trace.height;
    const ww=m.wfall.width, wh=m.wfall.height;
    const st=STATE[d.id];
    st.frameCount++;

    const arr = buildTrace(d, d.id, frame);

    // Trace
    drawTrace(m.trace.getContext('2d'), w, h, arr);
    m.annot.width=w; m.annot.height=h;
    drawAnnotations(m.annot.getContext('2d'), d, d.id, arr, w, h);

    // Peak readout
    let peak=-120;
    d.signals.forEach((sig,si)=>{
      if(sig.bg) return;
      if(!isSigActive(d.id,si)) return;
      let cf=sig.freqGHz;
      if(sig.type==='fhss') cf=sig.hopFreqs[st.hopIdx[si]];
      const ci=freqToBin(cf,d.startGHz,d.stopGHz,d.bins);
      for(let i=Math.max(0,ci-8);i<Math.min(d.bins,ci+8);i++){
        if(arr[i]>peak) peak=arr[i];
      }
    });
    if(peak>-120){
      document.getElementById('peak-'+d.id).textContent=peak.toFixed(1)+' dBm';
    } else {
      document.getElementById('peak-'+d.id).textContent='— dBm';
    }

    // Waterfall
    const row = Array.from({length:d.bins},(_,i)=>dbmToColor(arr[i]));
    st.wfRows.unshift(row);
    if(st.wfRows.length>WF_MAX) st.wfRows.length=WF_MAX;
    drawWaterfall(m.wfall.getContext('2d'), ww, wh, st.wfRows, d.bins);
  });
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
